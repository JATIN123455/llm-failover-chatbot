services:
  - type: web
    name: llm-failover-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/app.db
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: true
      - key: DEFAULT_SYSTEM_PROMPT
        value: You are a helpful, concise assistant.
    disk:
      name: llm-chatbot-data
      mountPath: /var/data
      sizeGB: 1
